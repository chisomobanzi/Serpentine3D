name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt/OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev --locked --python 3.12
      - name: Unit tests
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        # -n auto: the tests are independent and each one brings its own
        # settings, journal and autosave directories, so they run one per
        # core. Memory is the limit, not cores: each worker can pass 2 GB,
        # and now and then the four together outgrow the runner's 16 GB.
        # With swap on, the runner then swaps until GitHub loses touch with
        # it, and the job sits for 45 minutes and ends with no log. With
        # swap off the kernel kills a test worker at once, these processes
        # before the runner's own, and pytest names the test it was on.
        run: |
          sudo swapoff -a
          echo 500 > /proc/self/oom_score_adj
          free -m
          uv run pytest tests/ -q -n auto --ignore=tests/e2e_dod.py
      - name: What ran out of memory
        if: failure()
        run: sudo dmesg | grep -iE "out of memory|killed process" || true

  headless-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libegl1 \
            libfontconfig1
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked --python 3.12
      - name: serp3d-batch smoke test
        run: |
          cat > smoke.py << 'PY'
          doc.add(geo.make_box((0, 0, 0), 10, 10, 10), name="Box")
          doc.run("filletedge", ["Box", "", "1"])
          doc.export("out.step")
          doc.export("out.glb")
          print("volume:", round(doc.volume("Box"), 1))
          PY
          uv run serp3d-batch smoke.py
          test -s out.step && test -s out.glb
