name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt/OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev --locked --python 3.12
      - name: Unit tests
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        # -n auto: the tests are independent and each one brings its own
        # settings, journal and autosave directories, so they run one per
        # core. Memory is the limit, not cores: the four together come close
        # to the runner's 16 GB. When they reach it, the runner's own
        # program starves with them until GitHub loses touch with it, and
        # the job sits for 45 minutes and ends with no log. So the tests run
        # in a memory group of their own, capped below the runner's memory:
        # there they can only squeeze each other, the runner keeps going,
        # and the step's timeout and log still work.
        run: |
          ( while sleep 5; do free -m | awk '/^Mem:/ {m = $3} /^Swap:/ {s = $3} END {print m, s}'; done > "$RUNNER_TEMP/memory.log" ) &
          sudo -E env "PATH=$PATH" systemd-run --scope --quiet \
            --uid="$(id -u)" --gid="$(id -g)" -p MemoryMax=14G \
            uv run pytest tests/ -q -n auto --ignore=tests/e2e_dod.py
      - name: Memory the tests used
        if: always()
        run: |
          sort -n -k1 "$RUNNER_TEMP/memory.log" | tail -1 | awk '{print "most memory in use: " $1 " MB"}'
          sort -n -k2 "$RUNNER_TEMP/memory.log" | tail -1 | awk '{print "most swap in use: " $2 " MB"}'
          free -m
          sudo dmesg | grep -iE "out of memory|killed process" || true

  headless-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libegl1 \
            libfontconfig1
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked --python 3.12
      - name: serp3d-batch smoke test
        run: |
          cat > smoke.py << 'PY'
          doc.add(geo.make_box((0, 0, 0), 10, 10, 10), name="Box")
          doc.run("filletedge", ["Box", "", "1"])
          doc.export("out.step")
          doc.export("out.glb")
          print("volume:", round(doc.volume("Box"), 1))
          PY
          uv run serp3d-batch smoke.py
          test -s out.step && test -s out.glb
