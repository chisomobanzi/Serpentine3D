[project]
name = "serpentine3d"
version = "0.10.7"
description = "Open-source NURBS surface modeller for Linux with MCP integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Chisomo Banzi" }]
requires-python = ">=3.10"
dependencies = [
    # OCP 8 removed compatibility names used throughout the modelling kernel.
    "cadquery-ocp==7.9.3.1.1",
    "PySide6>=6.6",
    "shiboken6>=6.6",       # checks whether a destroyed GL share group is still valid
    "numpy>=1.26",
    "pye57>=0.4.19,<0.5",
    "PyOpenGL>=3.1",
    "mcp>=2",               # the server is written against mcp.server.mcpserver
    "httpx>=0.27,<1",       # the AI client speaks it directly; mcp 2 moved to httpx2
    "rhino3dm>=8.0",
    "ezdxf>=1.1",
    "svgelements>=1.9",
    # SketchUp files (#42): read from the reverse-engineered format, no SDK.
    # Held to 1.3 because the importer reads a table from its parse results.
    "openskp>=1.3,<1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/chisomobanzi/Serpentine3D"

[project.scripts]
serp3d = "serpentine3d.launcher:main"
serp = "serpentine3d.launcher:main"          # short alias, like `code` for VS Code
serp3d-mcp = "serpentine3d.mcp_server.server:main"
serp3d-batch = "serpentine3d.batch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["serpentine3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
